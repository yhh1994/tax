<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential for proper mobile zooming and scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Makes the site behave like a standalone iOS app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tax Tracker">
    
    <!-- App Icon for iOS Home Screen -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/tax.png">
    
    <title>Tax News Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 sm:p-6 max-w-4xl mx-auto text-gray-900">
    <h1 class="text-2xl sm:text-3xl font-bold mb-4">Tax News Tracker</h1>
    
    <input type="text" id="search" placeholder="Search tax topics (e.g. R&D, SEC 174, tariffs)..." 
           class="w-full p-3 border border-gray-300 rounded-lg mb-6 shadow-sm text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
           
    <div id="feed" class="space-y-4"></div>

    <script>
        let articles = [];
        async function loadNews() {
            const res = await fetch('./data/news.json');
            articles = await res.json();
            render(articles);
        }

        function render(data) {
            const container = document.getElementById('feed');
            container.innerHTML = data.map(item => `
                <div class="p-4 sm:p-5 bg-white rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition">
                    <!-- 1. Source & Date Metadata -->
                    <div class="flex justify-between items-center mb-2 gap-2">
                        <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 bg-blue-50 text-blue-700 rounded border border-blue-200">
                            ${item.source}
                        </span>
                        <span class="text-xs text-gray-400 font-mono">${item.published}</span>
                    </div>
                    
                    <!-- 2. News Title -->
                    <a href="${item.link}" target="_blank" class="block text-base sm:text-lg font-semibold text-gray-900 hover:text-blue-600 transition leading-snug">
                        ${item.title}
                    </a>
                    
                    <!-- 3. AI Summary -->
                    <p class="text-sm text-gray-600 mt-2 leading-relaxed">
                        ${item.summary}
                    </p>
                    
                    <!-- 4. Dynamic Gemini AI Tags -->
                    <div class="mt-3 flex flex-wrap gap-1.5">
                        ${(item.tags || []).map(tag => `
                            <span class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded-md border border-gray-200">
                                ${tag}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = articles.filter(a => a.title.toLowerCase().includes(q) || a.summary.toLowerCase().includes(q));
            render(filtered);
        });

        loadNews();
    </script>
</body>
</html>
